
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#d8b4fe,#fbcfe8);
    text-align: center;
    padding: 50px;
}
.card {
    background: white;
    padding: 30px;
    border-radius: 25px;
    max-width: 350px;
    margin: auto;
    box-shadow: 0 5px 20px #a78bba;
}
img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 5px solid #c084fc;
    object-fit: cover;
}
h1 { color: #9333ea; }
p { color: #704080; }
</style>
</head>

<body>
<div class="card">
    <img src="profile.jpg">
    <h1>🌷 Hello! 🌷</h1>
    <h2>พัชนิดา แตงศรี</h2>
    <p>ยินดีต้อนรับสู่เว็บไซต์ของฉัน 💜</p>
    <p>🎓 นักเรียน</p>
    <p>🎨 งานอดิเรก : ฟังเพลง เล่นเกม</p>
    <p>⭐ ทักษะ : HTML, CSS</p>
    <p>💕 ขอบคุณที่เข้ามาเยี่ยมชม</p>
</div>
</body>
</html>
